<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIVITAS offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f3ee; color: #1c1917; font-family: system-ui, sans-serif; padding: 16px; }
    main { max-width: 360px; text-align: center; }
    button { margin-top: 16px; height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #b93d0c; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icon.svg" width="56" height="56" alt="" />
    <h1>You're offline</h1>
    <p>CIVITAS needs a connection for live rooms, voice and collaboration. Your saved cities are safe on the server.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
